services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.7.1
    environment:
      CLICKHOUSE_DB: music
      CLICKHOUSE_USER: ${CLICKHOUSE_ETL_USER:-etl}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ETL_PASSWORD:-etl}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client
          --user "$${CLICKHOUSE_USER}"
          --password "$${CLICKHOUSE_PASSWORD}"
          --query "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  etl:
    build:
      context: .
      dockerfile: docker/Dockerfile.etl
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: music
      CLICKHOUSE_USER: ${CLICKHOUSE_ETL_USER:-etl}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ETL_PASSWORD:-etl}
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse-data:
